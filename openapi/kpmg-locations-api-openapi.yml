      summary: Update a Location
      description: '### Updates an Existing Location ###


        This API allows users to update an existing location in the KPMG Origins platform. The user must specify the client id of the location.

        The user can update locations of organisation they are associated with.

        Field Name | Description | Data Type / Format | Example

        ---|---|---|---

        Name | The name of the location. | String | Sample Co Sydney Processing Plant

        CountryCode | The three digit country code of the location. | String | AUS

        City | The city where the location is situated. | String | Sydney

        Address | The address where the location is situated (excluding city, state, and postcode). | String | Unit 5, 78 Avalon Avenue

        Postcode | The postcode where the location is situated. | String | 2000

        State | The State where the location is situated. | String | NSW

        Longitude | The longitude where the location is situated. | number | -33.865144

        Latitude | The latitude where the location is situated. | number | 151.202132

        TimeZone | The timezone where the location is situated. | String | UTC+10:00: Sydney

        OtherIds | Any other alternative internal identifiers of the location. | [ID_Type].[ID_Value] | SAMPLELOC.123456789

        GooglePlaceId | The google place ID of the location. | String | ChIJgUbEo8cfqokR5lP9_Wh_DaM

        Email | The email linked to the location. | String | location@test.kpmgorigins.com


        The sample request will be drafted as:

        ```

        [

        {

        "path": "/State",

        "op": "replace",

        "from": "NSW",

        "value": "QLD"

        },

        {

        "path": "/Email",

        "op": "replace",

        "from": "location@test.kpmgorigins.com",

        "value": "location-2@test.kpmgorigins.com"

        }

        ]

        ```'
      parameters:
      - name: clientId
        in: path
        description: Client id of the location to update
        required: true
        schema:
          title: String
          type: string
      requestBody:
