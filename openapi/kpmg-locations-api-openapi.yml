  /cr/client-api/v1/locations/{id}:
    get:
      tags:
      - Locations
      summary: Retrieves a Location by Location ID
      description: '### Retrieves a Location by a Location ID ###

        This API allows users to search for details on a location by providing the location ID.


        The format for location ID is:


        [ID_Type].[ID_Value]


        For example, the location ID listed below would qualify for the required syntax:


        LOC.123456789


        Sample request:


        GET locations/LOC.123456789'
      parameters:
      - name: id
        in: path
        description: Location ID.
        required: true
        schema:
          title: ClientId
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerFaultErrorResponse'
        '200':
          description: Returns the list of locations based on the provided filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLocationByIdResponse'
      security:
      - Bearer token: []
      operationId: getCrClientApiV1LocationsById
      x-operation-id-source: derived
