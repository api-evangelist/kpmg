openapi: 3.2.0
info:
  title: KPMG Origins Locations API
  description: '- How to authenticate

    - Definitions of Key API Endpoints

    - Other Information


    KPMG Origins provides customers with access to their data, and data shared with them, through APIs. The APIs allow customers with the ability to create, update and extract available data.


    ## How to authenticate

    1) Create API credentials via KPMG Origins UI (NB: only users with the Administrator role can manage API credentials):

    - Login to KPMG Origins

    - Go to Settings page, then API Credentials tab

    - Create API credentials

    - Copy the Client Id and Secret (NB: you will not be able to recover the secret value if lost, however, you can generate a new one)

    2) Exchange API Credentials for a short-lived _access token_

    - Make a POST request to **https://<KPMG Origins hostname>/cr/client-api/v1/token**

    ```

    {

    "clientId": "",

    "secret": ""

    }

    ```

    3) Make authenticated requests to KPMG Origins API:

    - Use the access token value form the token API response as a Bearer token to make requests to the API i.e. set Authorization header like this: `Authorization: Bearer `

    ```

    NB: access token is only valid for a short time, if requests start failing with 401 status code, repeat steps 2) and 3)

    ```


    ## Definitions of Key API Endpoints


    This section explains key definitions of key data entities and API endpoints


    * **Organisation**: the organisation can either be an organisation or an individual.

    - An *organisation* is a participant which usually holds an ABN or ACN, usually an entity participating in commercial activities.

    - An *individual* is a participant who has no ABN or ACN. For example, in Movement, a generator who is a private individual (e.g. residential asbestos pick-up).


    This distinction is necessary as it relates to a validation in the ``post organisation`` API.

    * **Location**: locations represent geographical sites which are operated by organisations. Each location possesses a unique location ID to distinguish it from other locations in the system, as well as an organisation / client ID that specifies which organisation operates it.


    Please see the details on each individual API to learn more about the specific criteria needed for a successful payload.


    ## Other Information

    - The format for Client Id mentioned in the APIs is ``IDType.IDValue``

    - By default, the collection of items returned can include up to 10,000 items, but this can be changed via the ``Limit`` and ``Skip`` parameters.'
  version: '1.0'
tags:
- name: Locations
  description: APIs for Locations
paths:
  /cr/client-api/v1/locations:
    post:
      tags:
      - Locations
      summary: Create a New Location
      description: '### Creates a New Location ###


        This API allows users to create a new location in the KPMG Origins platform. The User must specify the organisation that is the owner or custodian of the location.

        Field Name | Description | Mandatory | Data Type / Format | Example

        ---|---|---|---|---

        id | The internal identifier of the location that was created by the client. If one is not provided, one will be auto-generated for that location. | | [ID_Type].[ID_Value] | LOC.123456789

        organisationId | The **Organisation / Client ID** of the organisation. The User can provide their own Organisation / Cient ID. In addition, they can creating a location on behalf of another organisation. | Mandatory | [ID_Type].[ID_Value] | ABN.12345678910

        name | The name of the location. | Mandatory | String | Sample Co Sydney Processing Plant

        countryCode | The three digit country code of the location. | Mandatory | String | AUS

        city | The city where the location is situated. | Mandatory | String | Sydney

        address | The address where the location is situated (excluding city, state, and postcode). | Mandatory | String | Unit 5, 78 Avalon Avenue

        postcode | The postcode where the location is situated. | Mandatory | String | 2000

        state | The State where the location is situated. | Mandatory | String | NSW

        longitude | The longitude where the location is situated. | Mandatory | number | -33.865144

        latitude | The latitude where the location is situated. | Mandatory | number | 151.202132

        timezone | The timezone where the location is situated. | Mandatory | String | UTC+10:00: Sydney

        otherIds | Any other alternative internal identifiers of the location. | | [ID_Type].[ID_Value] | SAMPLELOC.123456789

        googlePlaceId | The google place ID of the location. | | String | ChIJgUbEo8cfqokR5lP9_Wh_DaM

        geoData | The geo json data of the location. | | JObject | {"type":"FeatureCollection","features":[{"type":"Feature","properties":{"Producer Name":"Producer 2","Producer Country":"US","Production Place Name":"place 4"},"geometry":{"coordinates":[[[-104.5982275585944,40.0864026500478],[-104.71940938616444,39.88138559039132],[-104.51166910773692,39.805173411506104],[-103.91164152130597,39.8356005398515],[-104.03282334887601,39.97464425984117],[-104.32279415056169,40.083693499590936],[-104.5982275585944,40.0864026500478]]],"type":"Polygon"},"id":0}]}'
      requestBody:
        description: Request to Create a New Location Associated with an Organisation.
        content:
          application/json-patch+json:
            schema:
              title: CreateLocationRequest
              allOf:
              - $ref: '#/components/schemas/CreateLocationRequest'
          application/json:
            schema:
              title: CreateLocationRequest
              allOf:
              - $ref: '#/components/schemas/CreateLocationRequest'
          text/json:
            schema:
              title: CreateLocationRequest
              allOf:
              - $ref: '#/components/schemas/CreateLocationRequest'
          application/*+json:
            schema:
              title: CreateLocationRequest
              allOf:
              - $ref: '#/components/schemas/CreateLocationRequest'
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerFaultErrorResponse'
        '201':
          description: New Location Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLocationByIdResponse'
      security:
      - Bearer token: []
      operationId: postCrClientApiV1Locations
      x-operation-id-source: derived
    get:
      tags:
      - Locations
      summary: Retrieve Locations Based on the Specified Filter
      description: '### Retrieve Locations Based on the Specified Filter ###


        This API allows users to get a list of all locations based on the specified filters.


        The five filters are:

        Field Name | Description | Data Type / Format | Example

        ---|---|---|---

        ids | Search sections of the string of the location ID. | [ID_Type].[ID_Value] | LOC.12

        search | Specifies the string that must appear in the location name in the response. Note that a minimum of 4 characters is required. The API searches through:

        **Name**, **City**, **Country Name** and **Address**

        | String | Sample Co Sydney

        archived | Specifies whether or not the location has been archived. | String | Unarchived

        limit | Specifies the maximum number of items or records that should be included in the response. | Integer(number) | 10

        skip | specifies the offset or starting point from where the API should begin returning the results. It specifies the number of items or records that should be skipped or ignored before returning the requested data, and is useful for navigating to different pages or datasets in the result. | Integer(number) | 0

        useFuzzyMatching | (Optional) use fuzzy matching on Address field, could extended to the fields in future. | Boolean | True/False

        Therefore, a sample request specifying for:

        * 10000 entries in the response, AND

        * with zero skipped entries, AND

        * where the Location ID is "gln.5149730576176", AND

        * where the location is **unarchived**, AND

        * the search term is **sample**


        Sample request:


        GET locations/query?search=Australia&ids=gln.5149730576176&limit=10000&skip=0;search=sample;archived=UnArchived'
      parameters:
      - name: ids
        in: query
        description: Filter by Location IDs
        schema:
          title: ClientId[]
          type: array
          items:
            title: ClientId
            type: string
      - name: search
        in: query
        description: The specific string to detect in the location name.
        schema:
          title: String
          type: string
      - name: archived
        in: query
        description: Whether or not this location is archived.
        schema:
          title: ArchivedFilter
          enum:
          - All
          - UnArchived
          - Archived
          type: string
      - name: limit
        in: query
        description: The number of entries permitted in the response.
        schema:
          title: Int32
          type: integer
          format: int32
      - name: skip
        in: query
        description: The number of entries to skip in the response.
        schema:
          title: Int32
          type: integer
          format: int32
      - name: useFuzzyMatching
        in: query
        description: (Optional) Use fuzzy matching on Address field (could be extended to other fields in future).
        schema:
          title: Boolean
          type: boolean
      - name: include
        in: query
        description: Extra data to include in the response.
        schema:
          title: ExtraLocationDataToInclude[]
          type: array
          items:
            title: ExtraLocationDataToInclude
            enum:
            - GeoData
            type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerFaultErrorResponse'
        '200':
          description: Returns the list of locations based on the provided filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedCollectionResponse__GetLocationByIdResponse'
      security:
      - Bearer token: []
      operationId: getCrClientApiV1Locations
      x-operation-id-source: derived
