              op: replace
            - value: ChIJgUbEo8cfqokR5lP9_Wh_DaM
              path: /GooglePlaceId
              op: replace
            - value: '*Updated Markdown Description*'
              path: /DescriptionMarkDown
              op: replace
            - value:
              - SAMPLELOC.123456789
              path: /OtherIds
              op: replace
          application/json:
            schema:
              title: Operation[]
