          - string
          - 'null'
      additionalProperties: false
    LockedErrorDetails:
      title: LockedErrorDetails
      allOf:
      - $ref: '#/components/schemas/ErrorDetails'
      - type: object
        additionalProperties: false
    ErrorResponse__ServerFaultErrorDetails:
      title: ErrorResponse<ServerFaultErrorDetails>
      type: object
