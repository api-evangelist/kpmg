          - 'null'
      additionalProperties: false
    ServerFaultErrorResponse:
      title: ServerFaultErrorResponse
      allOf:
      - $ref: '#/components/schemas/ErrorResponse__ServerFaultErrorDetails'
      - type: object
        additionalProperties: false
    IssueTokenResponse:
      title: IssueTokenResponse
      type: object
      properties:
        access_Token:
          title: String
          type:
          - string
          - 'null'
      additionalProperties: false
    ErrorDetails:
